<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moon phase</title>
  <link rel="icon" href="tsukimoji/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="tsukimoji/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="tsukimoji/apple-touch-icon.png">
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --ink: #e8eef8;
      --muted: #8b97ab;
      --line: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "Iowan Old Style", Palatino, Georgia, serif;
      background:
        radial-gradient(ellipse at 50% 0%, #1a2744 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
    }
    main {
      text-align: center;
      padding: 2rem 1.25rem 3rem;
      max-width: 28rem;
    }
    .logo {
      display: block;
      width: min(22rem, 85vw);
      height: auto;
      margin: 0 auto 2rem;
    }
    .emoji {
      font-size: clamp(7rem, 28vw, 11rem);
      line-height: 1;
      margin: 0;
      filter: drop-shadow(0 0 40px rgba(210, 220, 255, 0.25));
    }
    h1 {
      font-weight: 500;
      font-size: 1.75rem;
      letter-spacing: 0.02em;
      margin: 0.6rem 0 0.35rem;
    }
    .meta {
      color: var(--muted);
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      margin: 0.2rem 0;
    }
    .bar {
      margin: 1.4rem auto 0.4rem;
      width: min(16rem, 70vw);
      height: 6px;
      border-radius: 999px;
      background: var(--line);
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #6d7c99, #f4f1e8);
    }
    .when {
      margin-top: 1.6rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
    }
    button {
      margin-top: 1.4rem;
      font: inherit;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.85rem;
      color: var(--ink);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0.45rem 0.9rem;
      cursor: pointer;
    }
    button:hover { border-color: rgba(255, 255, 255, 0.25); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="tsukimoji/logo.png" alt="tsukiMOJi — moon phase emoji for any date" width="1280" height="400">
    <p class="emoji" id="emoji" aria-hidden="true">🌑</p>
    <h1 id="name">Moon</h1>
    <p class="meta" id="lit"></p>
    <div class="bar" aria-hidden="true"><span id="fill"></span></div>
    <p class="meta" id="age"></p>
    <p class="when" id="when"></p>
    <button type="button" id="refresh">Update</button>
  </main>
  <script>
    const PHASES = [
      { emoji: "🌑", name: "New Moon" },
      { emoji: "🌒", name: "Waxing Crescent" },
      { emoji: "🌓", name: "First Quarter" },
      { emoji: "🌔", name: "Waxing Gibbous" },
      { emoji: "🌕", name: "Full Moon" },
      { emoji: "🌖", name: "Waning Gibbous" },
      { emoji: "🌗", name: "Last Quarter" },
      { emoji: "🌘", name: "Waning Crescent" },
    ];

    const SYNODIC_MONTH_MS = 29.530588853 * 24 * 60 * 60 * 1000;
    const KNOWN_NEW_MOON_MS = Date.UTC(2000, 0, 6, 18, 14, 0);

    function getMoonPhase(date = new Date()) {
      const cycles = (date.getTime() - KNOWN_NEW_MOON_MS) / SYNODIC_MONTH_MS;
      const age = ((cycles % 1) + 1) % 1;
      const index = Math.floor((age + 1 / 16) * 8) % 8;
      const illumination = (1 - Math.cos(age * 2 * Math.PI)) / 2;
      return {
        emoji: PHASES[index].emoji,
        name: PHASES[index].name,
        ageDays: age * 29.530588853,
        illumination,
      };
    }

    function render() {
      const phase = getMoonPhase();
      const pct = Math.round(phase.illumination * 100);
      document.getElementById("emoji").textContent = phase.emoji;
      document.getElementById("name").textContent = phase.name;
      document.getElementById("lit").textContent = "About " + pct + "% illuminated";
      document.getElementById("fill").style.width = pct + "%";
      document.getElementById("age").textContent =
        "Day " + phase.ageDays.toFixed(1) + " of the lunar cycle";
      document.getElementById("when").textContent = new Date().toLocaleString(undefined, {
        dateStyle: "full",
        timeStyle: "short",
      });
      document.title = phase.emoji + " " + phase.name;
    }

    document.getElementById("refresh").addEventListener("click", render);
    render();
  </script>
</body>
</html>
